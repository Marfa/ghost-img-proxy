name: Deploy img proxy VPS

on:
  workflow_dispatch:
    inputs:
      cloudflare_api_token:
        description: "Cloudflare API token with Zone.DNS Edit on themarfa.name (used once to create img A record)"
        required: false
        type: string
      skip_dns:
        description: "Skip Cloudflare DNS step"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: deploy-img-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cloudflare DNS A img.themarfa.name
        if: ${{ inputs.skip_dns != true }}
        env:
          CLOUDFLARE_API_KEY: ${{ inputs.cloudflare_api_token }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_KEY}" ]]; then
            echo "No cloudflare_api_token input — skipping DNS (ensure img A matches bot.themarfa.name, proxied off)"
            exit 0
          fi
          pip install -q python-dotenv
          python scripts/cf_dns_img.py

      - name: Install nginx site over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP=/opt/ghost-img-proxy
            mkdir -p "$APP"
            if [[ -d "$APP/.git" ]]; then
              cd "$APP"
              git fetch --prune origin
              git reset --hard origin/main
            else
              git clone https://github.com/Marfa/ghost-img-proxy.git "$APP"
              cd "$APP"
            fi
            bash scripts/install_vps.sh

      - name: Public smoke
        run: |
          set -euo pipefail
          sleep 3
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 \
            'https://feeds.themarfa.name/gimg/c/71/cf/71cf070c-b8aa-467e-9efd-cf18f7dcf253/content/images/size/w30/2018/01/DSC_0094-3-.jpg' || echo fail)
          echo "feeds_gimg_http_code=$code"
          test "$code" = "200"
          curl -fsS https://img.themarfa.name/health || true
          echo
          img_code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 \
            'https://img.themarfa.name/c/71/cf/71cf070c-b8aa-467e-9efd-cf18f7dcf253/content/images/size/w30/2018/01/DSC_0094-3-.jpg' || echo fail)
          echo "img_http_code=$img_code"
          test "$img_code" = "200"
