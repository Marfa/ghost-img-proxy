# HTTP-only bootstrap for ACME before certificates exist.
server {
    listen 80;
    listen [::]:80;
    server_name img.themarfa.name;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        default_type text/plain;
        return 200 'img proxy bootstrap — waiting for TLS';
    }
}
