# Ghost image CDN failover proxy for img.themarfa.name
# Mirrors storage.ghost.io paths; only /c/ and /content/ are proxied.

server {
    listen 80;
    listen [::]:80;
    server_name img.themarfa.name;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name img.themarfa.name;

    ssl_certificate     /etc/letsencrypt/live/img.themarfa.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.themarfa.name/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Deny everything except Ghost storage image paths (not an open proxy).
    location / {
        default_type text/plain;
        return 404 'not found';
    }

    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 'ok';
    }

    # Ghost(Pro) CDN object paths, e.g. /c/<hex>/.../content/images/...
    location ~ ^/c/[0-9a-fA-F/]+/ {
        limit_except GET HEAD { deny all; }

        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $ghost_storage storage.ghost.io;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $ghost_storage;
        proxy_set_header Host $ghost_storage;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cookie;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_pass https://$ghost_storage;

        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Ghost-Img-Proxy "img.themarfa.name" always;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # Occasional relative /content/images/... style paths
    location ^~ /content/images/ {
        limit_except GET HEAD { deny all; }

        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $ghost_storage storage.ghost.io;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $ghost_storage;
        proxy_set_header Host $ghost_storage;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cookie;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_pass https://$ghost_storage;

        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Ghost-Img-Proxy "img.themarfa.name" always;
        expires 7d;
        add_header Cache-Control "public" always;
    }
}
