# FreshRSS / feeds.themarfa.name path-based Ghost CDN image proxy.
# Used when img.themarfa.name DNS/TLS is not ready yet; also fine as permanent path.
# URL: https://feeds.themarfa.name/gimg/c/.../content/images/...

location ^~ /gimg/ {
    limit_except GET HEAD { deny all; }

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $ghost_storage storage.ghost.io;

    # Strip /gimg prefix, mirror remaining path onto storage.ghost.io
    rewrite ^/gimg/(.*)$ /$1 break;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name $ghost_storage;
    proxy_set_header Host $ghost_storage;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cookie;

    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_pass https://$ghost_storage;

    add_header Access-Control-Allow-Origin * always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Ghost-Img-Proxy "feeds.themarfa.name/gimg" always;
    expires 7d;
    add_header Cache-Control "public" always;
}
